<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation Detail | Manufacturing Execution System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/pages.css">
    <link rel="stylesheet" href="../../assets/css/detail-project.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body data-page="quotations" data-title="Quotation Detail" data-breadcrumb="Quotations / Detail">
    <div class="app">
        <aside class="sidebar"><div><a href="../../index.html" class="company-logo"><img src="../../assets/img/logo.PNG" alt="Logo"><div class="company-info"><small>Manufacturing Execution System</small></div></a><ul class="sidebar-menu"></ul></div></aside>
        <div class="main-wrapper">
            <header class="top-navbar"><div class="navbar-left"><button class="menu-toggle" id="menuToggle"><i class="bi bi-list"></i></button><div><h5 class="mb-0">Quotation Detail</h5><small class="text-muted">Quotations / Detail</small></div></div></header>
            <main class="content">
                <div class="page-header">
                    <div><h2>Quotation Information</h2><p>Marketing Quotation Detail</p></div>
                    <div>
                        <button class="btn btn-success" id="approveBtn"><i class="bi bi-check-circle"></i> Approve</button>
                        <button class="btn btn-danger" id="rejectBtn"><i class="bi bi-x-circle"></i> Reject</button>
                        <a href="index.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back</a>
                    </div>
                </div>
                <div class="card-default">
                    <div class="row">
                        <div class="col-md-6 detail-item"><label>Quotation Number</label><h6 id="quotationNumber">-</h6></div>
                        <div class="col-md-6 detail-item"><label>Client</label><h6 id="client">-</h6></div>
                        <div class="col-md-6 detail-item"><label>PIC</label><h6 id="pic">-</h6></div>
                        <div class="col-md-6 detail-item"><label>Machine</label><h6 id="machine">-</h6></div>
                        <div class="col-md-6 detail-item"><label>Amount</label><h6 id="amount">-</h6></div>
                        <div class="col-md-6 detail-item"><label>Status</label><span class="badge-kustom" id="statusBadge">-</span></div>
                        <div class="col-md-6 detail-item"><label>Created At</label><h6 id="createdAt">-</h6></div>
                        <div class="col-md-6 detail-item"><label>Deadline</label><h6 id="deadline">-</h6></div>
                    </div>
                </div>
                <div class="card-default mt-4"><h5>Description</h5><p id="description">-</p></div>
            </main>
        </div>
    </div>
    <script src="../../assets/js/config/app.config.js"></script>
    <script src="../../assets/js/utils/path.js"></script>
    <script src="../../assets/js/utils/constants.js"></script>
    <script src="../../assets/js/utils/format.js"></script>
    <script src="../../assets/js/api/mock-data.js"></script>
    <script src="../../assets/js/api/client.js"></script>
    <script src="../../assets/js/api/quotations.js"></script>
    <script src="../../assets/js/components/layout.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="../../assets/js/pages/quotation-detail.js"></script>
</body>
</html>
